templates:
  movement: '^{movement}( .+)? to {distance}$'
  range: '^{range}( .+)? to {distance}$'
  deal_injury: '^{action}( with the .*)? to Deal \d+ {injury} Injury( (to the {body_system} system))?$'
  passive_deal_injury: '^When a creature (gets within {distance}) Deal \d {injury} Injury|Injuries$'
  ignore_injury: '^Ignore (\d+|all)( {injury})? (Injury|Injuries)( (to the ({body_system}) system|to this Limb|from .*))?$' 
  disrepair: '^(When Injuring creatures with this Limb,)|(When Injured) {disrepair} Body Parts are immediatly {disrepair}?$'
  grant_condition: '^Grant the ({condition}(,( or)?)? )+Condition to (creatures (that {sense} you {action}|you {action}|that {sense} the .+|you {sense}|((that get)? within {distance}( of the .*)?))|yourself when .+)$'
  ignore_condition: '^((This {scope} Ignores)|(Ignore)) the ({condition}) condition( ((except|for|from|while)(.*)|to this Limb))?$'
  senses: '^{sense}( .*)? within {distance}$'
  challenge: "^Use|Do .* to reduce a Challenge's Difficulty by \\d+$"
  communiciation: "^Use .* to Communicate$"
  split_turn: "End your Turn {time}, select another Creature and continue your Turn {time}"
  produce: "{produce} (an? {amount} of .+|.+ to {distance})"
  use_produce: "The .+ ({produce} .* to {distance})"


